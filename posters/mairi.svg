<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="The Andy Richter Call-In Show on SiriusXM, Conan O'Brien Radio">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#101a27"/>
   <stop offset="1" stop-color="#0a0d12"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="0%" r="85%">
   <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.20"/>
